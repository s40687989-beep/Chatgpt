
name: Android Cloud Lab

on:
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
          disable-animations: true
          script: |
            adb devices
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.model
            
